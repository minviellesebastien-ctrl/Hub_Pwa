<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Mon Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hub">

        <!-- =========================
             MON PATRIMOINE
        ========================== -->

        <section class="card card-patrimoine">

            <h1>MON PATRIMOINE</h1>

            <div class="patrimoine-content">

                <div class="value-box">

                    <span class="total-value">
                        93,4 k
                    </span>

                    <span class="evolution">
                        ↗ +4,8 %
                    </span>

                </div>


                <div class="graph">

                    <div class="bar bar-1"></div>
                    <div class="bar bar-2"></div>
                    <div class="bar bar-3"></div>
                    <div class="bar bar-4"></div>
                    <div class="bar bar-5"></div>

                    <svg viewBox="0 0 300 150" preserveAspectRatio="none">

                        <polyline
                            points="0,125 48,112 92,116 138,82 183,91 230,52 270,60 300,28"
                            fill="none"
                        />

                    </svg>

                </div>

            </div>

        </section>


        <!-- =========================
             MES SORTIES
        ========================== -->

        <section class="card card-small">

            <h2>MES SORTIES</h2>

            <div class="small-content">

                <div class="icon ticket-icon">
                    <span></span>
                </div>

                <div class="next-info">

                    <span class="label">
                        Prochain
                    </span>

                    <span class="date">
                        04 septembre
                    </span>

                    <span class="countdown">
                        dans 4 jours
                    </span>

                </div>

            </div>

        </section>


        <!-- =========================
             MES VOYAGES
        ========================== -->

        <section class="card card-small">

            <h2>MES VOYAGES</h2>

            <div class="small-content">

                <div class="icon plane-icon">
                    ✈
                </div>

                <div class="next-info">

                    <span class="label">
                        Prochain
                    </span>

                    <span class="date">
                        18 septembre
                    </span>

                    <span class="destination">
                        Londres
                    </span>

                    <span class="countdown">
                        dans 18 jours
                    </span>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
