<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A0D0F">
    <title>Mes PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Lumières d'ambiance -->
    <div class="glow-top"></div>
    <div class="glow-bottom"></div>

    <div id="app">

        <!-- Écran vidéo d'intro -->
        <section id="intro">
            <div id="logo-container">
                <video id="intro-video" autoplay muted playsinline>
                    <source src="intro.mp4" type="video/mp4">
                </video>
            </div>
        </section>

        <!-- Menu principal -->
        <section id="menu">

            <div class="pwa-card" id="vinyl">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </div>

            <div class="pwa-card" id="evenements">
                <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
             </div>

            <div class="pwa-card" id="voyages">
                <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
            </div>
                
            <div class="pwa-card" id="autre">
                <svg viewBox="0 0 24 24"><path d="M5 19h3v-6H5v6zm6 0h3v-10h-3v10zm6 0h3V5h-3v14z"/></svg>
            </div>

                

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
