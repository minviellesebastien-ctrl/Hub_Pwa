<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Mon Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hub">

        <!-- PATRIMOINE -->
        <section class="card card-patrimoine">

            <h2>MON PATRIMOINE</h2>

            <div class="patrimoine-content">

                <div class="patrimoine-info">
                    <div class="value-box">
                        <span class="total-value">93,4 k€</span>
                        <span class="evolution">↗ +4,8 %</span>
                    </div>
                </div>

                <div class="graph">
                    <div class="bar bar-1"></div>
                    <div class="bar bar-2"></div>
                    <div class="bar bar-3"></div>
                    <div class="bar bar-4"></div>
                    <div class="bar bar-5"></div>

                    <svg viewBox="0 0 300 150" preserveAspectRatio="none">
                        <polyline
                            points="0,125 55,105 105,112 155,75 205,82 255,45 300,25"
                            fill="none"
                        />
                    </svg>
                </div>

            </div>

        </section>


        <!-- SORTIES -->
        <section class="card card-small">

            <h2>MES SORTIES</h2>

            <div class="small-content">

                <div class="icon ticket-icon">
                    <span></span>
                </div>

                <div class="next-info">
                    <span class="label">Prochain</span>
                    <span class="date">04 septembre</span>
                    <span class="countdown">dans 4 jours</span>
                </div>

            </div>

        </section>


        <!-- VOYAGES -->
        <section class="card card-small">

            <h2>MES VOYAGES</h2>

            <div class="small-content">

                <div class="icon plane-icon">
                    ✈
                </div>

                <div class="next-info">
                    <span class="label">Prochain</span>
                    <span class="date">18 septembre</span>
                    <span class="countdown">dans 18 jours</span>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
