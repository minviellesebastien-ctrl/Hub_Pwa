name: Synchroniser le Hub

on:
  repository_dispatch:
    types: [update-hub]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Mettre à jour hub-data.json
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > hub-data.json

      - name: Enregistrer la modification
        run: |
          git config user.name "Hub Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hub-data.json

          git diff --cached --quiet || git commit -m "Mise à jour automatique du Hub"

          git push
