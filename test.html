<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aperçu du Hub PWA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Halos lumineux en arrière-plan */
        .glow-top {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(30, 58, 138, 0.5) 0%, transparent 70%);
            pointer-events: none;
        }

        .glow-bottom {
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(88, 28, 135, 0.5) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Grille du Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 16px;
            width: 90%;
            max-width: 400px;
            height: 400px;
            z-index: 1;
        }

        /* Style des cartes */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 5px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s ease, background 0.2s ease;
            cursor: pointer;
        }

        .card:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.12);
        }

        .card svg {
            width: 56px;
            height: 56px;
        }

        .card span {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Couleurs des contours identiques */
        #vinyl { border-color: #FFB800; }
        #vinyl svg { fill: #FFB800; }

        #agenda { border-color: #0066FF; }
        #agenda svg { fill: #0066FF; }

        #voyages { border-color: #00B4B4; }
        #voyages svg { fill: #00B4B4; }

        #avenir { border-color: #FF6600; }
        #avenir svg { fill: #FF6600; }
    </style>
</head>
<body>

    <div class="glow-top"></div>
    <div class="glow-bottom"></div>

    <div class="menu-grid">
        
        <!-- Vinyl -->
        <div class="card" id="vinyl">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            <span>Vinyls</span>
        </div>

        <!-- Agenda -->
        <div class="card" id="agenda">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
            <span>Agenda</span>
        </div>

        <!-- Voyages -->
        <div class="card" id="voyages">
            <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
            <span>Voyages</span>
        </div>

        <!-- À venir / Budget -->
        <div class="card" id="avenir">
            <svg viewBox="0 0 24 24"><path d="M11 17h2v-1.17c1.73-.44 3-2.01 3-3.83 0-2.21-1.79-4-4-4V7h-2v1.17c-1.73.44-3 2.01-3 3.83 0 2.21 1.79 4 4 4V17zm1-6c1.1 0 2 .9 2 2s-.9 2-2 2v-4zm-2-2c0-1.1.9-2 2-2v4c-1.1 0-2-.9-2-2z"/></svg>
            <span>À venir</span>
        </div>

    </div>

</body>
</html>
